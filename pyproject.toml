[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-decomp-assist"
version = "0.1.0"
description = "Local fine-tuned model that proposes matching C++ for small PS2 (MIPS R5900) functions, verified by each project's own compiler and comparer."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "mlx-lm==0.32.2",
    "transformers==5.22.2",
    "huggingface-hub==2.4.0",
    "tree-sitter==0.26.1",
    "tree-sitter-cpp==0.23.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "mypy==2.4.1"]

[project.scripts]
decomp-assist = "decomp_assist.__main__:main"

[tool.setuptools]
packages = ["decomp_assist", "pipeline", "eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
exclude = ["eval/workers/"]
