# Stage 6 full SFT-1 (T1): all rule-clean train rows, 3 epochs = 16509 micro-steps = 4127 optimizer steps
train: true
fine_tune_type: lora
data: data/sft/full
batch_size: 1
grad_accumulation_steps: 4
iters: 16509
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1.0e-4, 4127, 0.0]
num_layers: -1
max_seq_length: 2048
mask_prompt: true
grad_checkpoint: true
steps_per_report: 40
steps_per_eval: 1500
save_every: 1500
seed: 0
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
