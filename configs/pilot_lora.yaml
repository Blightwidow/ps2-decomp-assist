# Stage 5 pilot: plan section 6 (r=32, alpha=64 -> scale 2, lr 1e-4 cosine, completion-only loss)
train: true
fine_tune_type: lora
data: data/sft/pilot
batch_size: 1
grad_accumulation_steps: 4
iters: 3000
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 750, 0.0]
num_layers: -1
max_seq_length: 2048
mask_prompt: true
grad_checkpoint: true
steps_per_report: 40
steps_per_eval: 600
save_every: 200
seed: 0
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
