# Stage 7 SFT-2: 1 epoch of T2 repair + T1 replay (7268 examples), resumed from the SFT-1 `-it` adapter, optimizer state fresh
train: true
fine_tune_type: lora
data: data/sft/sft2
batch_size: 1
grad_accumulation_steps: 4
iters: 7268
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 20
  arguments: [5.0e-5, 1817, 0.0]
num_layers: -1
max_seq_length: 2048
mask_prompt: true
grad_checkpoint: true
steps_per_report: 40
steps_per_eval: 1000
save_every: 1000
seed: 0
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
clear_cache_threshold: 4294967296
